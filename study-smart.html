{t:"Title",h:"<h2 style='font-size:32px;text-align:center;margin-top:60px'>"+tt+"</h2><p class=ctr><b class=n>3rd stage<br>1st semester / 2025-2026</b></p>"},
{t:"Introduction (divider)",h:"<h2 style='font-size:40px;text-align:center;margin-top:110px;color:var(--nv)'>Introduction</h2>"},
{t:"Inorganic chemistry",h:"<h2>Inorganic chemistry</h2><p>is the study of all the elements and their compounds except carbon and its compounds (which is studied under organic chemistry).</p><p>The term <span class=r>‘Pharmaceutical’</span> is used for any chemical substance useful in preventive or therapeutic or which finds use in the preparation of medicament. Some find use only in the laboratory during the preparation but may not be present in the final product; these are also incorporated under pharmaceuticals.</p>"},
{t:"Importance of inorganic pharmaceuticals",h:"<h2>Importance of Inorganic Pharmaceuticals</h2><p>Inorganic pharmaceuticals are useful in any of the following ways:</p><ul><li><b>Useful medicinally for their therapeutic purpose.</b> Example: Astringents and antimicrobials etc.</li><li><b>Useful as pharmaceutical aids.</b> Example: Bentonite, talc etc.</li><li><b>To change the reaction of body fluid. To acidify or alkalis.</b> Example: Antacids, alkalis, mineral acids.</li><li><b>Replacing or replenishing the normal content of body fluids.</b> Example: Sodium, potassium, calcium, chloride, phosphate etc.</li><li><b>Useful as reagents to carry out the reactions.</b> Example: Catalysts (platinum, nickel) oxidizing and reducing agents (lithium aluminum hydride).</li><li><b>Useful in Pharmaceutical analysis.</b> Example: Titrants such as potassium permanganate.</li></ul>"},
{t:"Atomic structure",h:"<h2>Atomic Structure</h2><p>The particles that make up an atom are called <b>subatomic particles</b> (sub- means “smaller size”). Atom composed of a central <span class=r><i>nucleus</i></span> surrounded by <span class=r><i>orbitals</i></span> which occupy discrete regions of space.</p><p>1. <i>Nucleus:</i> most of the mass of atom<br>&nbsp;&nbsp;➢ <i>Protons:</i> has positive charge.<br>&nbsp;&nbsp;➢ <i>Neutrons:</i> uncharged.</p><p>2. <i>Orbitals:</i><br>&nbsp;&nbsp;➢ <i>Electrons:</i> found in electron cloud, has negative charge.</p>"+atom},
{t:"The nucleus",h:"<h2>The nucleus</h2><p>The nucleus is at the center of the atom and contains <i>protons</i> and <i>neutrons</i>. Protons and neutrons are collectively known as <i>nucleons</i>.</p><p>Virtually all the mass of the atom is concentrated in the nucleus, because the electrons weigh so little.</p><div class='box ctr'><span class=r>No. of protons = Atomic number of the atom<br>No. of protons + No. of neutrons = Mass number of the atom</span></div><p class=r>Note: Mass number is also called the nucleon number</p><p>This information can be given simply in the form:</p><p class=ctr style='font-size:30px'><sup style='font-size:16px'>19 (Mass number)</sup><br><b>F</b><br><sub style='font-size:16px'>9 (Atomic number)</sub></p>"},
{t:"The electrons",h:"<h2>The electrons</h2><p>Atoms are electrically neutral, and the positiveness of the protons is balanced by the negativeness of the electrons. It follows that in a neutral atom:</p><p class='ctr r'>No. of electrons = No. of protons</p><p>So, if an oxygen atom (atomic number = 8) has 8 protons, it must also have 8 electrons; if a chlorine atom (atomic number = 17) has 17 protons, it must also have 17 electrons.</p>"},
{t:"Electronic configuration",h:"<h2>Electronic Configuration</h2><ul><li>Every element has different electronic configuration.</li><li>The number of protons determines the identity of the element.</li><li>The number of electrons determines the charge.</li><li>The number of neutrons determines the isotope.</li><li>All chemistry done at the electronic level (that is why electrons are very important).</li><li><b>Electronic configuration</b> is the arrangement of electrons in an atom. These electrons fill the atomic orbitals.</li></ul>"},
{t:"Aufbau principle",h:"<h2 style='color:var(--nv)'>How to write Electron configuration using Aufbau Principle</h2><h3>Diagonal rule (Aufbau Principle)</h3><p><b class=r>Max electrons: (s) = 2 · (p) = 6 · (d) = 10 · (f) = 14</b></p><table><tr><td>1s</td><td></td><td></td><td></td></tr><tr><td>2s</td><td>2p</td><td></td><td></td></tr><tr><td>3s</td><td>3p</td><td>3d</td><td></td></tr><tr><td>4s</td><td>4p</td><td>4d</td><td>4f</td></tr><tr><td>5s</td><td>5p</td><td>5d</td><td>5f</td></tr><tr><td>6s</td><td>6p</td><td>6d</td><td></td></tr><tr><td>7s</td><td>7p</td><td></td><td></td></tr></table><p style='font-size:13px;color:var(--mu)'>Draw diagonal arrows from top-right to bottom-left through each row.</p><table><tr><th>Element</th><th>Total electrons</th><th>Orbital diagram</th><th>Electron configuration</th></tr><tr><td>H</td><td>1</td><td>1s ↑</td><td>1s¹</td></tr><tr><td>He</td><td>2</td><td>1s ↑↓</td><td>1s²</td></tr><tr><td>Li</td><td>3</td><td>1s ↑↓ · 2s ↑</td><td>1s² 2s¹</td></tr><tr><td>Be</td><td>4</td><td>1s ↑↓ · 2s ↑↓</td><td>1s² 2s²</td></tr><tr><td>B</td><td>5</td><td>1s ↑↓ · 2s ↑↓ · 2p ↑</td><td>1s² 2s² 2p¹</td></tr></table><p class=r>The order in which the orbitals are filled with electrons is: 1s &lt; 2s &lt; 2p &lt; 3s &lt; 3p &lt; 4s &lt; 3d &lt; 4p &lt; 5s &lt; 4d &lt; 5p &lt; 6s &lt; 4f &lt; 5d &lt; 6p &lt; 7s &lt; 5f &lt; 6d &lt; 7p</p>"},
{t:"Shorthand & valence electrons",h:"<h2>Shorthand &amp; Valence Electrons</h2><ul><li>Electronic configurations can also be written in a <span class=r>shorthand</span> which references the last completed orbital shell (i.e., all orbitals with the same principal quantum number ‘n’ have been filled).</li><li>Ex.: electronic configuration of <b>Na (11)</b> can write as 3s¹, the electronic configuration of <b>Li (3)</b> can write as 2s¹.</li><li>The electrons in the outer shell (beyond the stable core) called the <span class=r>valence electrons</span>.</li><li class=n>Valence Electrons: electrons are the electrons in the last shell or energy level of an atom.</li></ul><table><tr><th>Na (11) Sodium 22.99</th><th>Li (3) Lithium 6.94</th></tr><tr><td>1s² 2s² 2p⁶ <b class=r>3s¹</b></td><td>1s² <b class=r>2s¹</b></td></tr></table><p style='font-size:13px;color:var(--mu)'>s holds up to 2 · p holds up to 6 · d holds up to 10</p>"},
{t:"Ionization",h:"<h2>Ionization</h2><p>➢ When an atom <b>gains an electron</b> becomes <span class=r>negatively charge</span> (the electrons number more than protons number); called an <span class=r>anion</span>. In the same way nonmetal atoms can gain electrons.</p><p>➢ Metal atoms can <b>lose electrons</b> to become <span class=r>positively charge cations</span>.</p><p class=r>Note: Cations are always smaller than the original atom. Conversely, anions are always larger than the original atom.</p>"},
{t:"The periodic law",h:"<h2>The Periodic Law</h2><ul><li>A table of this type was suggested independently around 1868-1870 by the Russian chemist Mendelleeff and German chemist Lothar Meyer.</li><li>When elements arranged in order of increasing atomic number, there is a periodic repetition of their physical and chemical properties.</li></ul>"},
{t:"Periodic table",h:"<h2>Periodic table of the elements</h2>"+pt("")},
{t:"Alkali metals (outline)",h:"<h2>Alkali Metals</h2><ul><li><b>Lithium (Li), Sodium (Na), Potassium (K):</b> Electron configuration, chemical properties of metals, Advantages and disadvantages using lithium-based drugs.</li><li><b>Sodium as an essential ion in the human body:</b> Drugs, diet and toxicity of sodium ions.</li><li><b>Potassium and its clinical application.</b></li></ul>"+pt("a")},
{t:"Alkali metals (group 1)",h:"<h2>Alkali Metals</h2><ul><li>Members of group 1 of the periodic table (first vertical column) with exception of hydrogen are called alkali metals.</li><li>In terms of a clinical use, <b>Na</b> and <b>K</b> are essential ions for the human body and any imbalance in them must corrected.</li><li><b>Li</b> (lithium salts) is medically used to treat bipolar disorder (BD).</li></ul>"},
{t:"Electronic configuration (table)",h:"<h2>Electronic configuration</h2><ul><li>This group of elements belongs to <span class=r>s-block</span> metals as they only have one electron in their outer shell.</li><li>The chemistry of the metals is characterized by the loss of this s electron to form a monocationic ion M⁺.</li></ul><table><tr><th>Atomic number</th><th>Symbol</th><th>Electronic configuration</th></tr><tr><td>3</td><td>Li</td><td>1s²2s¹ (or) [He]2s¹</td></tr><tr><td>11</td><td>Na</td><td>1s²2s²2p⁶3s¹ (or) [Ne]3s¹</td></tr><tr><td>19</td><td>K</td><td>1s²2s²2p⁶3s²3p⁶4s¹ (or) [Ar]4s¹</td></tr><tr><td>37</td><td>Rb</td><td>1s²2s²2p⁶3s²3p⁶3d¹⁰4s²5s¹ (or) [Kr]5s¹</td></tr><tr><td>55</td><td>Cs</td><td>1s²2s²2p⁶3s²3p⁶3d¹⁰4s²4p⁶4d¹⁰5s²5p⁶6s¹ (or) [Xe]6s¹</td></tr><tr><td>87</td><td>Fr</td><td>[Rn]7s¹</td></tr></table>"},
{t:"s, p, d, f blocks",h:"<h2>Blocks of the periodic table</h2>"+pt("b")+"<p style='font-size:13px;color:var(--mu)'>s-block: 1s–7s · d-block: 3d–6d · p-block: 2p–7p · f-block: 4f, 5f (with 5d, 6d).</p>"},
{t:"Chemical behavior",h:"<h2>Chemical behavior of alkali metals</h2><ol><li>It have a <b>silvery white appearance</b> except for caesium which is golden yellow.</li><li>They are all <b>soft metals</b> (can be cut with a knife). The softness of the metal increases within the group.</li><li>They are generally <b>very reactive and oxidase in the air</b>. The reactivity increases within the group.</li><li>All alkali metals react violently with water with the formation of the metal hydroxide and hydrogen.</li></ol><div class='box ctr'>2Li(s) + 2H₂O → 2LiOH + H₂(g) ↑</div>"},
{t:"Pharmaceutical applications",h:"<h2>5. In terms of their pharmaceutical applications,</h2><ul><li>alkali metals are not directly useable mainly due to their reaction behavior in aqueous media. Nevertheless, alkali metal <b>halides</b>, some <b>oxides</b>, <b>carbonates</b>, <b>citrates</b> and other <b>salts</b> are of <b>medicinal interest</b>. <span class=r>NaCl &amp; KCl solutions are important as oral rehydration salts, and KCl can also be used to treat potassium depletion.</span></li><li>The various salts of <b>sodium, lithium and potassium</b> have the widest use and are discussed in detail in the following sections. These applications range from the use of <b>sodium &amp; potassium salts</b> used in treatment <span class=r>dehydration and restore mineral balances</span>, where <b>lithium salts</b> used in treatment of <span class=r>BD</span>.</li></ul>"},
{t:"Li: advantages",h:"<h2>👍 Advantages of using Li based drugs</h2><ul><li>In 1880, Lithium salts used as prophylaxis and treatment of <b>mania</b>, and as prophylaxis in <b>bipolar disorder (BD) &amp; recurrent depression</b>.</li><li>Its taken orally, usually as <b>lithium carbonate Li₂CO₃</b> or <b>lithium citrate [Li₃C₃H₅O(COO)₃]</b>, with a total dose of up to <b>30 mmol/day</b>.</li><li><b>Li₂CO₃</b> is the preferred lithium salt used, as it causes the least irritation to the stomach.</li></ul>"},
{t:"Li: disadvantages (1)",h:"<h2>👎 Disadvantages of using Li based drugs</h2><ul><li>It has a very narrow therapeutic index window (monitoring of blood levels essential during the treatment).</li><li>✓ if <b>Li⁺ blood plasma concentrations more than 1.5 mmol/l</b> it may cause toxic effects, usually <span class=r>tremors in the fingers, renal impairment and convulsion. Also, memory problems are a very common side effect, and complaints about slowed mental ability and forgetfulness are commonly reported.</span></li><li>✓ <b>Extreme doses</b> can cause <span class=r>nausea and diarrhea.</span></li><li>✓ <b>Doses above 2 mmol/l</b> require <span class=r>emergency treatment (fatal).</span></li></ul>"},
{t:"Li: disadvantages (2)",h:"<h2>👎 Disadvantages (continued)</h2><ul><li><b>Weight gain &amp; decreased thyroid levels.</b></li><li>Lithium salts can lead to <b>diabetes insipidus</b><br>✓ Polyuria; excess production of urine, due to the damage of internal kidneys structures.</li><li><b>Drug-drug interaction:</b><br>✓ With nonsteroidal anti-inflammatory drugs (NSAIDs) by reducing lithium clearance by kidneys, leading to lithium toxicity.<br>✓ Furthermore, the concurrent use of diuretics, which can result in sodium depletion, can make lithium toxicity worse and can be hazardous.</li></ul>"},
{t:"Sodium: roles (1)",h:"<h2>Sodium as an essential ion in the human body</h2><h3>The main biological roles of sodium ions are:</h3><h3 class=r>1. Maintenance of body fluids in humans.</h3><ul><li><b>Sodium</b> is an essential mineral for the human body and crucial for the regulation of the body fluid via its osmosis activity.</li><li>Its account for over 90% of all ions in the plasma and in the interstitial fluid, and <b>It is the most abundant cation in the extracellular fluid</b> (Na⁺ content controls the extracellular volume).</li></ul><p>* In particular, the <span class=r>kidneys</span> play an important role in regulating the fluid level of the body as well as the filtration, secretion and re-absorption of Na⁺ in the nephrons, the functional unit of the kidney.</p>"},
{t:"Sodium: roles (2)",h:"<h3 class=r style='font-size:20px'>2. Neurons &amp; transmission of nerve impulses.</h3><ul><li>In the human body, <span class=r>Na⁺</span> is often used to actively build up an electrostatic potential across membranes, with potassium ions <span class=r>K⁺</span> being the counter-ion. The build-up of an electrostatic potential across cell membranes is important to allow the transmission of nerve impulses.</li></ul><h3 class=r style='font-size:20px'>3. Play a crucial role in the contraction of muscles and in the mode of action of several enzymes.</h3><ul><li><span class=r>Na⁺</span> used in the human body <b>to establish osmotic gradients</b>, which in turn is crucial to control the water balance. Furthermore, decreases in blood pressure and in Na⁺ concentrations are sensed by the kidneys, and hormones (e.g. renin, antidiuretic hormones (ADHs), atrial natriuretic peptide) are released that control the blood pressure, osmotic balances and water-retaining mechanisms.</li></ul>"},
{t:"Drugs, diet and toxicity",h:"<h2>Drugs, diet and toxicity</h2><p><span class=r>Sodium chloride solutions</span> are normally used when the patient is diagnosed with sodium depletion and dehydration. Treatment is mostly administered intravenously, but in chronic conditions (mild to moderate sodium loss) <span class=r>sodium chloride</span> or <span class=r>sodium bicarbonate</span> can be given orally. Oral rehydration therapies usually use a mixture of alkali metal-based salts such as <b>NaCl, KCl</b> and their <b>citrates</b>.</p><table><tr><td class=ctr style='font-size:22px'><b>(a) NaCl</b></td><td class=ctr>(b)"+bic("Na")+"</td><td class=ctr>(c)"+cit("Na")+"</td></tr></table><p class=ctr style='font-size:13px'><i>Chemical structures of (a) sodium chloride, (b) sodium bicarbonate and (c) sodium citrate</i></p>"},
{t:"Sodium bicarbonate",h:"<h2 class=r>Sodium bicarbonate</h2><p>is usually administered orally to regulate the serum pH.</p><ul><li><b>Imbalances of the plasma pH can be due to problems occurring in the kidneys</b> such as <b>renal tubular acidosis</b> (medical condition that occurs when body accumulate acid due to kidneys failing to regulate the pH of the urine and the blood plasma).</li><li><span class=r>In renal tubular acidosis</span>, the kidneys <b>either</b> <span class=r>fail to filter or secrete acid ions (H⁺) from the plasma</span> (secretion takes place in the distal tubule), or to recover bicarbonate ions (HCO₃⁻) from the filtrate (passive re-absorption takes place in the proximal tubule, active re-absorption at the distal tubule), which is necessary to balance the pH.</li><li>In the view of this mode of action, <b>the pharmaceutically active component of sodium bicarbonate</b> is the <span class=r>bicarbonate anion</span>, but the <span class=r>cation Na⁺ is responsible for solubility and compatibility.</span></li></ul>"},
{t:"Diet & toxicity of NaCl",h:"<h2>Dietary NaCl and toxicity</h2><ul><li><span class=r>The most common dietary source of NaCl is table salt;</span> daily recommended NaCl intake is recommended to be limited to 6 g for adults, whereas intake for children should be significantly lower.</li><li>Low sodium plasma levels <span class=r>(hyponatremia)</span>, which can be a result of <span class=r>dysfunction kidneys</span> or <span class=r>sodium loss in the bowels</span>, also cause damage to the human body via osmotic imbalances and if necessary, must be treated. Low blood pressure, dehydration and muscle cramps are signs of a sodium deficiency.</li><li>The high salt plasma levels <span class=r>(hypernatremia)</span> can result in cardiovascular disorders such as hypertension.</li><li>Signs of acute toxicity may be seen after ingestion of 500–1000 mg/kg body weight NaCl. <span class=r>Symptoms:</span> vomiting, ulceration of the gastrointestinal (GI) tract and renal damage, also increased risk of kidney stones formation is believed to be a result of high salt intake.</li></ul>"},
{t:"Potassium",h:"<h2>Potassium and its clinical application</h2><ul><li>In the human body, 95% of the K⁺ can be found inside the cells, with the remaining 5% mainly circulating in the blood plasma. This balance is carefully maintained by the Na⁺/K⁺ pump, and imbalances, such as seen in hypo or Hyperkalaemia, can have serious consequences.</li></ul><p class=ctr style='font-size:13px'>19 · K · Potassium · 39.098</p>"},
{t:"Hypokalemia",h:"<h2>Hypokalemia</h2><p class=r style='font-size:19px'>Is a potentially serious condition where the patient has low levels of K⁺ in blood plasma.</p><ul><li><span class=r>Symptoms:</span> weakness of the muscles or ECG (electrocardiogram) abnormalities.</li><li>It may result due to <span class=r>reduced K⁺ intake caused by GI disturbance</span>, such as <b>diarrhea</b> and <b>vomiting</b>, or <span class=r>increased excretion of K⁺ caused by diuresis</span>; (patients treated with diuretics such as <span class=r>loop diuretics &amp; thiazides</span>. These classes of drugs increase the secretion of Na⁺ in the nephrons to increase water excretion. Unfortunately, they also increase the excretion of K⁺ and lead to hypokalemia. <span class=r>In contrast</span>, potassium-sparing diuretics actively preserve potassium ions.</li></ul>"},
{t:"KCl & K bicarbonate",h:"<ul><li><b>Potassium salts are preferably given as liquid preparations (KCl is the preferred salt used).</b> Other potassium-based salts can be used if the patient is at risk of developing hyperchloremia – increased chloride plasma levels.</li><li><b>Oral bicarbonate solutions</b> such as <b>potassium bicarbonate</b> are typically given orally for chronic acidosis states – low pH of the blood plasma. This can be again due to impaired kidney function (The use of potassium bicarbonate for the treatment of acidosis must be carefully evaluated, as even small changes of the potassium plasma levels can have severe consequences).</li></ul>"+bic("K")},
{t:"Potassium citrate",h:"<ul><li><span class=r>Potassium citrate</span> is used in the United Kingdom as an over-the-counter drug for the relief from <b>discomfort experienced in mild urinary-tract infections</b> by increasing the urinary pH.</li><li>It should be not given to men if:<br>– They experience pain in the kidney area (risk of kidney stones) or if blood or pus is present in the urine.<br>– Also, patients with raised blood pressure or diabetes should avoid taking potassium citrate without consultation with their general practitioner (GP).</li></ul>"+cit("K")},
{t:"Potassium tablets",h:"<p>❑ <span class=r style='font-size:20px'>Potassium salts</span> are also available in the form of tablets or capsules for oral application especially as nonprescription medicine.</p><ul><li>Usually, their formulation is designed to allow the potassium ions to be slowly secreted, because very high concentrations of K⁺ are known to be toxic to tissue cells and can cause injury to the gastric mucosa.</li><li>Therefore, nonprescription potassium supplement pills are usually restricted to &lt;100 mg of K⁺.</li></ul>"},
{t:"Hyperkalaemia: toxicity",h:"<h2>Adverse effects and toxicity: Hyperkalaemia</h2><p>❑ The therapeutic window for <b>K⁺</b> in the blood plasma is very small <span class=r>(3.5–5.0 mmol)</span>, and especially Hyperkalaemia, an increased level of K⁺ in the plasma, can lead to severe health problems.</p><p>❑ Potassium salts can cause nausea and vomiting and in extreme cases can lead to small bowel ulcerations.</p><p>❑ Acute severe Hyperkalaemia is defined when the plasma potassium concentration exceeds <span class=r>6.5 mmol/l</span> or <span class=r>if ECG changes are seen.</span> This can lead to <span class=r>cardiac arrest</span>, which needs immediate treatment.</p>"},
{t:"Hyperkalaemia: treatment",h:"<p>❑ Treatment options include the use of <span class=r>calcium gluconate</span> intravenous injections, which minimizes the effects of Hyperkalaemia on the heart.</p><p>❑ I.V injection of <span class=r>soluble insulin</span> promotes the shift of potassium ions into the cells.</p><p>❑ <span class=r>Diuretics</span> also can be used to increase the secretion of K⁺ in the kidneys, and</p><p>❑ <span class=r>Dialysis</span> can be a good option if urgent treatment is required.</p><p>❑ <span class=r>Ion-exchange resins</span>, such as <span class=r>polystyrene sulfonate resins</span>, may be used in mild to moderate Hyperkalaemia to remove excess potassium if there are no ECG changes present.</p><p>* Especially in patients suffering from kidney diseases or end-stage renal failure, the potassium levels must be monitored very carefully and corrected if necessary. (Cuse build-up of potassium in the blood plasma may trigger a cardiac arrest)</p>"},
{t:"The end",h:"<h2 style='font-size:48px;text-align:center;margin-top:100px'>the end...</h2>"}

var AR={"inorganic pharmaceutical chemistry":"الكيمياء الصيدلانية غير العضوية","3rd stage1st semester / 2025-2026by: lecturer sadeq jaafer":"<b class='n'>المرحلة الثالثة<br>الفصل الأول / 2025-2026<br>بواسطة: المدرّس صادق جعفر</b>","introduction":"المقدمة","inorganic chemistry":"الكيمياء غير العضوية","is the study of all the elements and their compounds except carbon and its compounds (whic":"هي دراسة جميع العناصر ومركباتها ما عدا الكربون ومركباته (التي تُدرس ضمن الكيمياء العضوية).","the term ‘pharmaceutical’ is used for any chemical substance useful in preventive or thera":"يُستخدم مصطلح <span class='r'>‘صيدلاني’ (Pharmaceutical)</span> لأي مادة كيميائية مفيدة في الوقاية أو العلاج، أو التي تدخل في تحضير الأدوية. وبعضها يُستخدم في المختبر فقط أثناء التحضير وقد لا يكون موجودًا في المنتج النهائي؛ وهذه أيضًا تندرج ضمن المواد الصيدلانية.","importance of inorganic pharmaceuticals":"أهمية المواد الصيدلانية غير العضوية","inorganic pharmaceuticals are useful in any of the following ways:":"تكون المواد الصيدلانية غير العضوية مفيدة بأي من الطرق التالية:","useful medicinally for their therapeutic purpose. example: astringents and antimicrobials ":"<b>مفيدة طبيًا لغرضها العلاجي.</b> مثال: القابضات ومضادات الميكروبات وغيرها.","useful as pharmaceutical aids. example: bentonite, talc etc.":"<b>مفيدة كمساعدات صيدلانية.</b> مثال: البنتونايت والتلك وغيرها.","to change the reaction of body fluid. to acidify or alkalis. example: antacids, alkalis, m":"<b>لتغيير تفاعل سوائل الجسم، أي للتحميض أو القلونة.</b> مثال: مضادات الحموضة والقلويات والأحماض المعدنية.","replacing or replenishing the normal content of body fluids. example: sodium, potassium, c":"<b>تعويض أو تجديد المحتوى الطبيعي لسوائل الجسم.</b> مثال: الصوديوم والبوتاسيوم والكالسيوم والكلوريد والفوسفات وغيرها.","useful as reagents to carry out the reactions. example: catalysts (platinum, nickel) oxidi":"<b>مفيدة ككواشف لإجراء التفاعلات.</b> مثال: المحفزات (البلاتين، النيكل) والعوامل المؤكسدة والمختزلة (هيدريد الليثيوم والألمنيوم).","useful in pharmaceutical analysis. example: titrants such as potassium permanganate.":"<b>مفيدة في التحليل الصيدلاني.</b> مثال: المعايِرات مثل برمنغنات البوتاسيوم.","atomic structure":"التركيب الذرّي","the particles that make up an atom are called subatomic particles (sub- means “smaller siz":"تُسمى الجسيمات التي تكوّن الذرة <b>الجسيمات دون الذرية</b> (البادئة sub- تعني «حجم أصغر»). تتكوّن الذرة من <span class='r'><i>نواة</i></span> مركزية تحيط بها <span class='r'><i>أفلاك</i></span> (orbitals) تشغل مناطق محددة من الفراغ.","1. nucleus: most of the mass of atom ➢ protons: has positive charge. ➢ neutrons: uncharged":"1. <i>النواة:</i> تحتوي على معظم كتلة الذرة<br>&nbsp;&nbsp;➢ <i>البروتونات:</i> ذات شحنة موجبة.<br>&nbsp;&nbsp;➢ <i>النيوترونات:</i> متعادلة الشحنة.","2. orbitals: ➢ electrons: found in electron cloud, has negative charge.":"2. <i>الأفلاك:</i><br>&nbsp;&nbsp;➢ <i>الإلكترونات:</i> توجد في سحابة الإلكترونات وذات شحنة سالبة.","the nucleus":"النواة","the nucleus is at the center of the atom and contains protons and neutrons. protons and ne":"تقع النواة في مركز الذرة وتحتوي على <i>البروتونات</i> و<i>النيوترونات</i>. وتُعرف البروتونات والنيوترونات معًا باسم <i>النيوكليونات</i>.","virtually all the mass of the atom is concentrated in the nucleus, because the electrons w":"تتركز كتلة الذرة تقريبًا بالكامل في النواة، لأن وزن الإلكترونات صغير جدًا.","no. of protons = atomic number of the atomno. of protons + no. of neutrons = mass number o":"<span class='r'>عدد البروتونات = العدد الذري للذرة<br>عدد البروتونات + عدد النيوترونات = العدد الكتلي للذرة</span>","note: mass number is also called the nucleon number":"ملاحظة: العدد الكتلي يُسمى أيضًا عدد النيوكليونات","this information can be given simply in the form:":"يمكن إعطاء هذه المعلومات ببساطة بالشكل التالي:","the electrons":"الإلكترونات","atoms are electrically neutral, and the positiveness of the protons is balanced by the neg":"الذرات متعادلة كهربائيًا، فالشحنة الموجبة للبروتونات تتوازن مع الشحنة السالبة للإلكترونات. ويترتب على ذلك أنه في الذرة المتعادلة:","no. of electrons = no. of protons":"عدد الإلكترونات = عدد البروتونات","so, if an oxygen atom (atomic number = 8) has 8 protons, it must also have 8 electrons; if":"فإذا كانت ذرة الأوكسجين (عددها الذري = 8) تحتوي على 8 بروتونات فلا بد أن تحتوي أيضًا على 8 إلكترونات؛ وإذا كانت ذرة الكلور (عددها الذري = 17) تحتوي على 17 بروتونًا فلا بد أن تحتوي على 17 إلكترونًا.","electronic configuration":"التوزيع الإلكتروني","every element has different electronic configuration.":"لكل عنصر توزيع إلكتروني مختلف.","the number of protons determines the identity of the element.":"عدد البروتونات يحدد هوية العنصر.","the number of electrons determines the charge.":"عدد الإلكترونات يحدد الشحنة.","the number of neutrons determines the isotope.":"عدد النيوترونات يحدد النظير (isotope).","all chemistry done at the electronic level (that is why electrons are very important).":"كل الكيمياء تحدث على المستوى الإلكتروني (ولهذا فإن الإلكترونات مهمة جدًا).","electronic configuration is the arrangement of electrons in an atom. these electrons fill ":"<b>التوزيع الإلكتروني</b> هو ترتيب الإلكترونات في الذرة. وهذه الإلكترونات تملأ الأفلاك الذرية.","how to write electron configuration using aufbau principle":"كيفية كتابة التوزيع الإلكتروني باستخدام مبدأ البناء (Aufbau)","diagonal rule (aufbau principle)":"القاعدة القطرية (مبدأ البناء)","max electrons: (s) = 2 · (p) = 6 · (d) = 10 · (f) = 14":"<b class='r'>الحد الأقصى للإلكترونات: (s) = 2 · (p) = 6 · (d) = 10 · (f) = 14</b>","draw diagonal arrows from top-right to bottom-left through each row.":"ارسم أسهمًا قطرية من أعلى اليمين إلى أسفل اليسار عبر كل صف.","the order in which the orbitals are filled with electrons is: 1s < 2s < 2p < 3s < 3p < 4s ":"ترتيب ملء الأفلاك بالإلكترونات هو: 1s &lt; 2s &lt; 2p &lt; 3s &lt; 3p &lt; 4s &lt; 3d &lt; 4p &lt; 5s &lt; 4d &lt; 5p &lt; 6s &lt; 4f &lt; 5d &lt; 6p &lt; 7s &lt; 5f &lt; 6d &lt; 7p","shorthand & valence electrons":"الصيغة المختصرة والإلكترونات التكافؤية","electronic configurations can also be written in a shorthand which references the last com":"يمكن أيضًا كتابة التوزيع الإلكتروني بصيغة <span class='r'>مختصرة (shorthand)</span> تشير إلى آخر غلاف مكتمل من الأفلاك (أي أن جميع الأفلاك ذات رقم الكم الرئيسي ‘n’ نفسه قد امتلأت).","ex.: electronic configuration of na (11) can write as 3s¹, the electronic configuration of":"مثال: يمكن كتابة التوزيع الإلكتروني لعنصر <b>Na (11)</b> بالشكل 3s¹، ولعنصر <b>Li (3)</b> بالشكل 2s¹.","the electrons in the outer shell (beyond the stable core) called the valence electrons.":"تُسمى الإلكترونات الموجودة في الغلاف الخارجي (بعد القلب المستقر) <span class='r'>الإلكترونات التكافؤية (valence electrons)</span>.","valence electrons: electrons are the electrons in the last shell or energy level of an ato":"الإلكترونات التكافؤية: هي الإلكترونات الموجودة في آخر غلاف أو مستوى طاقة في الذرة.","s holds up to 2 · p holds up to 6 · d holds up to 10":"s تتسع حتى 2 · p تتسع حتى 6 · d تتسع حتى 10","ionization":"التأين","➢ when an atom gains an electron becomes negatively charge (the electrons number more than":"➢ عندما تكتسب الذرة <b>إلكترونًا</b> تصبح <span class='r'>سالبة الشحنة</span> (عدد الإلكترونات أكبر من عدد البروتونات) وتسمى <span class='r'>أنيونًا</span>. وبالطريقة نفسها يمكن لذرات اللافلزات أن تكتسب إلكترونات.","➢ metal atoms can lose electrons to become positively charge cations.":"➢ يمكن لذرات الفلزات أن <b>تفقد إلكترونات</b> لتصبح <span class='r'>كاتيونات موجبة الشحنة</span>.","note: cations are always smaller than the original atom. conversely, anions are always lar":"ملاحظة: الكاتيونات دائمًا أصغر من الذرة الأصلية، وعلى العكس فإن الأنيونات دائمًا أكبر من الذرة الأصلية.","the periodic law":"القانون الدوري","a table of this type was suggested independently around 1868-1870 by the russian chemist m":"اقترح جدولًا من هذا النوع بشكل مستقل نحو عامي 1868-1870 الكيميائي الروسي مندليف والكيميائي الألماني لوثر ماير.","when elements arranged in order of increasing atomic number, there is a periodic repetitio":"عندما تُرتب العناصر بحسب ازدياد العدد الذري، يحدث تكرار دوري لخواصها الفيزيائية والكيميائية.","periodic table of the elements":"الجدول الدوري للعناصر","group numbering: iupac. based on the encyclopaedia britannica periodic table.":"ترقيم المجموعات: IUPAC. مبني على الجدول الدوري في موسوعة بريتانيكا.","alkali metals":"الفلزات القلوية","lithium (li), sodium (na), potassium (k): electron configuration, chemical properties of m":"<b>الليثيوم (Li) والصوديوم (Na) والبوتاسيوم (K):</b> التوزيع الإلكتروني، والخواص الكيميائية للفلزات، ومزايا وعيوب استخدام الأدوية المعتمدة على الليثيوم.","sodium as an essential ion in the human body: drugs, diet and toxicity of sodium ions.":"<b>الصوديوم كأيون أساسي في جسم الإنسان:</b> الأدوية والغذاء وسمّية أيونات الصوديوم.","potassium and its clinical application.":"<b>البوتاسيوم وتطبيقاته السريرية.</b>","members of group 1 of the periodic table (first vertical column) with exception of hydroge":"أعضاء المجموعة 1 من الجدول الدوري (العمود الرأسي الأول) باستثناء الهيدروجين تسمى فلزات قلوية.","in terms of a clinical use, na and k are essential ions for the human body and any imbalan":"من الناحية السريرية، يُعدّ <b>Na</b> و<b>K</b> أيونين أساسيين لجسم الإنسان، ويجب تصحيح أي اختلال في مستوياتهما.","li (lithium salts) is medically used to treat bipolar disorder (bd).":"يُستخدم <b>Li</b> (أملاح الليثيوم) طبيًا لعلاج الاضطراب ثنائي القطب (BD).","this group of elements belongs to s-block metals as they only have one electron in their o":"تنتمي هذه المجموعة من العناصر إلى فلزات <span class='r'>الكتلة s</span> لأن لها إلكترونًا واحدًا فقط في غلافها الخارجي.","the chemistry of the metals is characterized by the loss of this s electron to form a mono":"تتميز كيمياء هذه الفلزات بفقدان هذا الإلكترون s لتكوين أيون أحادي الشحنة الموجبة M⁺.","blocks of the periodic table":"كتل الجدول الدوري","s-block: 1s–7s · d-block: 3d–6d · p-block: 2p–7p · f-block: 4f, 5f (with 5d, 6d).":"الكتلة s: 1s–7s · الكتلة d: 3d–6d · الكتلة p: 2p–7p · الكتلة f: 4f, 5f (مع 5d, 6d).","chemical behavior of alkali metals":"السلوك الكيميائي للفلزات القلوية","it have a silvery white appearance except for caesium which is golden yellow.":"لها <b>مظهر أبيض فضي</b> ما عدا السيزيوم فلونه أصفر ذهبي.","they are all soft metals (can be cut with a knife). the softness of the metal increases wi":"جميعها <b>فلزات لينة</b> (يمكن قطعها بالسكين). وتزداد ليونة الفلز كلما نزلنا في المجموعة.","they are generally very reactive and oxidase in the air. the reactivity increases within t":"وهي بشكل عام <b>شديدة التفاعل وتتأكسد في الهواء</b>. ويزداد النشاط كلما نزلنا في المجموعة.","all alkali metals react violently with water with the formation of the metal hydroxide and":"تتفاعل جميع الفلزات القلوية بعنف مع الماء مكوّنةً هيدروكسيد الفلز والهيدروجين.","5. in terms of their pharmaceutical applications,":"5. من حيث تطبيقاتها الصيدلانية،","alkali metals are not directly useable mainly due to their reaction behavior in aqueous me":"لا يمكن استخدام الفلزات القلوية مباشرة، وذلك أساسًا بسبب سلوكها التفاعلي في الأوساط المائية. ومع ذلك فإن <b>هاليدات</b> الفلزات القلوية وبعض <b>الأكاسيد</b> و<b>الكربونات</b> و<b>السترات</b> و<b>الأملاح</b> الأخرى ذات <b>أهمية دوائية</b>. <span class='r'>محاليل NaCl و KCl مهمة كأملاح معالجة الجفاف الفموية، ويمكن أيضًا استخدام KCl لعلاج نقص البوتاسيوم.</span>","the various salts of sodium, lithium and potassium have the widest use and are discussed i":"أملاح <b>الصوديوم والليثيوم والبوتاسيوم</b> هي الأوسع استخدامًا وسيتم شرحها بالتفصيل في الأقسام التالية. وتتراوح هذه التطبيقات بين استخدام <b>أملاح الصوديوم والبوتاسيوم</b> في علاج <span class='r'>الجفاف واستعادة توازن المعادن</span>، واستخدام <b>أملاح الليثيوم</b> في علاج <span class='r'>الاضطراب ثنائي القطب (BD)</span>.","👍 advantages of using li based drugs":"👍 مزايا استخدام الأدوية المعتمدة على الليثيوم","in 1880, lithium salts used as prophylaxis and treatment of mania, and as prophylaxis in b":"في عام 1880 استُخدمت أملاح الليثيوم للوقاية من <b>الهوس</b> وعلاجه، وللوقاية من <b>الاضطراب ثنائي القطب (BD) والاكتئاب المتكرر</b>.","its taken orally, usually as lithium carbonate li₂co₃ or lithium citrate [li₃c₃h₅o(coo)₃],":"تؤخذ عن طريق الفم، عادةً على شكل <b>كربونات الليثيوم Li₂CO₃</b> أو <b>سترات الليثيوم [Li₃C₃H₅O(COO)₃]</b>، بجرعة إجمالية تصل إلى <b>30 ملي مول/يوم</b>.","li₂co₃ is the preferred lithium salt used, as it causes the least irritation to the stomac":"<b>Li₂CO₃</b> هو ملح الليثيوم المفضل، لأنه يسبب أقل تهيج للمعدة.","👎 disadvantages of using li based drugs":"👎 عيوب استخدام الأدوية المعتمدة على الليثيوم","it has a very narrow therapeutic index window (monitoring of blood levels essential during":"له نافذة مؤشر علاجي ضيقة جدًا (من الضروري مراقبة مستويات الدم أثناء العلاج).","✓ if li⁺ blood plasma concentrations more than 1.5 mmol/l it may cause toxic effects, usua":"✓ إذا كان <b>تركيز Li⁺ في بلازما الدم أكثر من 1.5 ملي مول/لتر</b> فقد يسبب آثارًا سمّية، وعادةً <span class='r'>رجفة في الأصابع واعتلال الكلى وتشنجات. كما أن مشاكل الذاكرة من الآثار الجانبية الشائعة جدًا، ويُبلَّغ كثيرًا عن شكاوى من بطء القدرة العقلية والنسيان.</span>","✓ extreme doses can cause nausea and diarrhea.":"✓ <b>الجرعات المفرطة</b> يمكن أن تسبب <span class='r'>الغثيان والإسهال.</span>","✓ doses above 2 mmol/l require emergency treatment (fatal).":"✓ <b>الجرعات التي تزيد على 2 ملي مول/لتر</b> تتطلب <span class='r'>علاجًا طارئًا (قد تكون مميتة).</span>","👎 disadvantages (continued)":"👎 العيوب (تتمة)","weight gain & decreased thyroid levels.":"<b>زيادة الوزن وانخفاض مستويات الغدة الدرقية.</b>","lithium salts can lead to diabetes insipidus✓ polyuria; excess production of urine, due to":"يمكن أن تؤدي أملاح الليثيوم إلى <b>السكري الكاذب (diabetes insipidus)</b><br>✓ بوال (Polyuria)؛ أي إنتاج مفرط للبول بسبب تضرر البنى الداخلية للكلى.","drug-drug interaction:✓ with nonsteroidal anti-inflammatory drugs (nsaids) by reducing lit":"<b>التداخل الدوائي:</b><br>✓ مع مضادات الالتهاب غير الستيرويدية (NSAIDs) إذ تقلل تصفية الكلى لليثيوم مما يؤدي إلى سمّية الليثيوم.<br>✓ كما أن الاستخدام المتزامن لمدرّات البول، التي قد تسبب نقص الصوديوم، يمكن أن يزيد سمّية الليثيوم سوءًا وقد يكون خطيرًا.","sodium as an essential ion in the human body":"الصوديوم كأيون أساسي في جسم الإنسان","the main biological roles of sodium ions are:":"الأدوار البيولوجية الرئيسية لأيونات الصوديوم هي:","1. maintenance of body fluids in humans.":"1. الحفاظ على سوائل الجسم عند الإنسان.","sodium is an essential mineral for the human body and crucial for the regulation of the bo":"<b>الصوديوم</b> معدن أساسي لجسم الإنسان وضروري لتنظيم سوائل الجسم من خلال نشاطه التناضحي.","its account for over 90% of all ions in the plasma and in the interstitial fluid, and it i":"يشكل أكثر من 90% من جميع الأيونات في البلازما والسائل الخلالي، و<b>هو الكاتيون الأكثر وفرة في السائل خارج الخلوي</b> (إذ يتحكم محتوى Na⁺ في الحجم خارج الخلوي).","* in particular, the kidneys play an important role in regulating the fluid level of the b":"* وعلى وجه الخصوص، تؤدي <span class='r'>الكلى</span> دورًا مهمًا في تنظيم مستوى سوائل الجسم، وكذلك في الترشيح والإفراز وإعادة امتصاص Na⁺ في النيفرونات، وهي الوحدة الوظيفية للكلية.","2. neurons & transmission of nerve impulses.":"2. الخلايا العصبية ونقل السيالات العصبية.","in the human body, na⁺ is often used to actively build up an electrostatic potential acros":"في جسم الإنسان، يُستخدم <span class='r'>Na⁺</span> غالبًا لبناء جهد كهروستاتيكي عبر الأغشية بنشاط، ويكون أيون البوتاسيوم <span class='r'>K⁺</span> هو الأيون المقابل. وبناء الجهد الكهروستاتيكي عبر أغشية الخلايا مهم للسماح بنقل السيالات العصبية.","3. play a crucial role in the contraction of muscles and in the mode of action of several ":"3. يؤدي دورًا حاسمًا في انقباض العضلات وفي آلية عمل عدة إنزيمات.","na⁺ used in the human body to establish osmotic gradients, which in turn is crucial to con":"يُستخدم <span class='r'>Na⁺</span> في جسم الإنسان <b>لإنشاء تدرجات تناضحية</b>، وهي بدورها حاسمة للتحكم بتوازن الماء. وإضافةً إلى ذلك، تستشعر الكلى انخفاض ضغط الدم وتراكيز Na⁺، فتُفرز هرمونات (مثل الرينين والهرمونات المضادة لإدرار البول (ADHs) والببتيد الأذيني المدر للصوديوم) تتحكم بضغط الدم والتوازنات التناضحية وآليات احتباس الماء.","drugs, diet and toxicity":"الأدوية والغذاء والسمّية","sodium chloride solutions are normally used when the patient is diagnosed with sodium depl":"تُستخدم <span class='r'>محاليل كلوريد الصوديوم</span> عادةً عندما يُشخَّص المريض بنقص الصوديوم والجفاف. ويُعطى العلاج غالبًا وريديًا، لكن في الحالات المزمنة (فقدان الصوديوم الخفيف إلى المتوسط) يمكن إعطاء <span class='r'>كلوريد الصوديوم</span> أو <span class='r'>بيكربونات الصوديوم</span> عن طريق الفم. وتستخدم علاجات الإماهة الفموية عادةً مزيجًا من أملاح قائمة على الفلزات القلوية مثل <b>NaCl و KCl</b> و<b>السترات</b> الخاصة بهما.","chemical structures of (a) sodium chloride, (b) sodium bicarbonate and (c) sodium citrate":"<i>التراكيب الكيميائية لـ (a) كلوريد الصوديوم، (b) بيكربونات الصوديوم، (c) سترات الصوديوم</i>","sodium bicarbonate":"بيكربونات الصوديوم","is usually administered orally to regulate the serum ph.":"تُعطى عادةً عن طريق الفم لتنظيم pH المصل.","imbalances of the plasma ph can be due to problems occurring in the kidneys such as renal ":"<b>قد تنتج اختلالات pH البلازما عن مشاكل في الكلى</b> مثل <b>الحُماض الأنبوبي الكلوي (renal tubular acidosis)</b> (حالة طبية يتراكم فيها الحمض في الجسم بسبب فشل الكلى في تنظيم pH البول وبلازما الدم).","in renal tubular acidosis, the kidneys either fail to filter or secrete acid ions (h⁺) fro":"<span class='r'>في الحُماض الأنبوبي الكلوي</span> تفشل الكلى <b>إما</b> في <span class='r'>ترشيح أو إفراز أيونات الحمض (H⁺) من البلازما</span> (ويحدث الإفراز في الأنبوب القاصي)، أو في استعادة أيونات البيكربونات (HCO₃⁻) من الراشح (إعادة الامتصاص السلبي في الأنبوب القريب، وإعادة الامتصاص النشط في الأنبوب القاصي)، وهو أمر ضروري لموازنة pH.","in the view of this mode of action, the pharmaceutically active component of sodium bicarb":"وبالنظر إلى آلية العمل هذه، فإن <b>المكوّن الفعّال صيدلانيًا في بيكربونات الصوديوم</b> هو <span class='r'>أنيون البيكربونات</span>، أما <span class='r'>كاتيون Na⁺ فهو المسؤول عن الذوبانية والتوافق.</span>","dietary nacl and toxicity":"NaCl الغذائي والسمّية","the most common dietary source of nacl is table salt; daily recommended nacl intake is rec":"<span class='r'>المصدر الغذائي الأكثر شيوعًا لـ NaCl هو ملح الطعام؛</span> ويُوصى بأن يُحدَّد المتناول اليومي من NaCl بـ 6 غرام للبالغين، بينما يجب أن يكون أقل بكثير للأطفال.","low sodium plasma levels (hyponatremia), which can be a result of dysfunction kidneys or s":"انخفاض مستويات الصوديوم في البلازما <span class='r'>(نقص صوديوم الدم hyponatremia)</span>، الذي قد ينتج عن <span class='r'>خلل في وظائف الكلى</span> أو <span class='r'>فقدان الصوديوم عبر الأمعاء</span>، يسبب أيضًا ضررًا لجسم الإنسان عبر الاختلال التناضحي، ويجب علاجه عند الضرورة. ومن علامات نقص الصوديوم انخفاض ضغط الدم والجفاف وتشنجات العضلات.","the high salt plasma levels (hypernatremia) can result in cardiovascular disorders such as":"ارتفاع مستويات الملح في البلازما <span class='r'>(فرط صوديوم الدم hypernatremia)</span> يمكن أن يؤدي إلى اضطرابات قلبية وعائية مثل ارتفاع ضغط الدم.","signs of acute toxicity may be seen after ingestion of 500–1000 mg/kg body weight nacl. sy":"قد تظهر علامات السمّية الحادة بعد تناول 500–1000 ملغم/كغم من وزن الجسم من NaCl. <span class='r'>الأعراض:</span> القيء وتقرّح الجهاز الهضمي (GI) وتلف الكلى، كما يُعتقد أن زيادة خطر تكوّن حصى الكلى ناتجة عن الإفراط في تناول الملح.","potassium and its clinical application":"البوتاسيوم وتطبيقاته السريرية","in the human body, 95% of the k⁺ can be found inside the cells, with the remaining 5% main":"في جسم الإنسان، يوجد 95% من K⁺ داخل الخلايا، بينما يدور الـ 5% المتبقية في بلازما الدم بشكل رئيسي. ويُحافَظ على هذا التوازن بعناية بواسطة مضخة Na⁺/K⁺، وقد تكون للاختلالات، كما في نقص أو فرط بوتاسيوم الدم، عواقب خطيرة.","hypokalemia":"نقص بوتاسيوم الدم (Hypokalemia)","is a potentially serious condition where the patient has low levels of k⁺ in blood plasma.":"هي حالة خطيرة محتملة يكون فيها لدى المريض مستويات منخفضة من K⁺ في بلازما الدم.","symptoms: weakness of the muscles or ecg (electrocardiogram) abnormalities.":"<span class='r'>الأعراض:</span> ضعف العضلات أو شذوذات في تخطيط القلب (ECG).","it may result due to reduced k⁺ intake caused by gi disturbance, such as diarrhea and vomi":"قد ينتج عن <span class='r'>انخفاض تناول K⁺ بسبب اضطراب الجهاز الهضمي</span> مثل <b>الإسهال</b> و<b>القيء</b>، أو عن <span class='r'>زيادة إفراز K⁺ بسبب إدرار البول</span>؛ (المرضى الذين يعالجون بمدرّات البول مثل <span class='r'>مدرّات العروة والثيازيدات</span>. تزيد هذه الأصناف من الأدوية إفراز Na⁺ في النيفرونات لزيادة إخراج الماء. ولكنها للأسف تزيد أيضًا إفراز K⁺ وتؤدي إلى نقص بوتاسيوم الدم. <span class='r'>وعلى النقيض</span>، فإن مدرّات البول الحافظة للبوتاسيوم تحافظ بنشاط على أيونات البوتاسيوم.","potassium salts are preferably given as liquid preparations (kcl is the preferred salt use":"<b>يُفضَّل إعطاء أملاح البوتاسيوم على شكل مستحضرات سائلة (KCl هو الملح المفضل).</b> يمكن استخدام أملاح أخرى قائمة على البوتاسيوم إذا كان المريض معرّضًا لخطر الإصابة بفرط كلوريد الدم (hyperchloremia) – ارتفاع مستويات الكلوريد في البلازما.","oral bicarbonate solutions such as potassium bicarbonate are typically given orally for ch":"<b>المحاليل الفموية للبيكربونات</b> مثل <b>بيكربونات البوتاسيوم</b> تُعطى عادةً عن طريق الفم في حالات الحُماض المزمن – أي انخفاض pH بلازما الدم. وقد يكون ذلك أيضًا بسبب ضعف وظائف الكلى (يجب تقييم استخدام بيكربونات البوتاسيوم لعلاج الحُماض بعناية، إذ إن حتى التغيرات الصغيرة في مستويات البوتاسيوم في البلازما قد تكون لها عواقب وخيمة).","potassium citrate is used in the united kingdom as an over-the-counter drug for the relief":"يُستخدم <span class='r'>سترات البوتاسيوم</span> في المملكة المتحدة كدواء بدون وصفة طبية لتخفيف <b>الانزعاج الناتج عن التهابات المسالك البولية الخفيفة</b> عن طريق رفع pH البول.","it should be not given to men if:– they experience pain in the kidney area (risk of kidney":"يجب عدم إعطاؤه للرجال إذا:<br>– عانوا من ألم في منطقة الكلى (خطر حصى الكلى) أو إذا وُجد دم أو قيح في البول.<br>– كما ينبغي للمرضى المصابين بارتفاع ضغط الدم أو السكري تجنب تناول سترات البوتاسيوم دون استشارة طبيبهم العام (GP).","❑ potassium salts are also available in the form of tablets or capsules for oral applicati":"❑ تتوفر <span class='r' style='font-size:20px'>أملاح البوتاسيوم</span> أيضًا على شكل أقراص أو كبسولات للاستعمال الفموي، خصوصًا كأدوية بدون وصفة طبية.","usually, their formulation is designed to allow the potassium ions to be slowly secreted, ":"عادةً ما تُصمَّم تركيبتها للسماح بإفراز أيونات البوتاسيوم ببطء، لأن التراكيز العالية جدًا من K⁺ معروفة بأنها سامة لخلايا الأنسجة ويمكن أن تسبب أذى لمخاطية المعدة.","therefore, nonprescription potassium supplement pills are usually restricted to <100 mg of":"لذلك تُحصَر أقراص مكملات البوتاسيوم التي تُباع بدون وصفة عادةً بأقل من 100 ملغم من K⁺.","adverse effects and toxicity: hyperkalaemia":"الآثار الضارة والسمّية: فرط بوتاسيوم الدم (Hyperkalaemia)","❑ the therapeutic window for k⁺ in the blood plasma is very small (3.5–5.0 mmol), and espe":"❑ النافذة العلاجية لـ <b>K⁺</b> في بلازما الدم صغيرة جدًا <span class='r'>(3.5–5.0 ملي مول)</span>، وخصوصًا فرط بوتاسيوم الدم، أي ارتفاع مستوى K⁺ في البلازما، يمكن أن يؤدي إلى مشاكل صحية خطيرة.","❑ potassium salts can cause nausea and vomiting and in extreme cases can lead to small bow":"❑ يمكن أن تسبب أملاح البوتاسيوم الغثيان والقيء، وفي الحالات الشديدة قد تؤدي إلى تقرحات في الأمعاء الدقيقة.","❑ acute severe hyperkalaemia is defined when the plasma potassium concentration exceeds 6.":"❑ يُعرَّف فرط بوتاسيوم الدم الحاد الشديد عندما يتجاوز تركيز البوتاسيوم في البلازما <span class='r'>6.5 ملي مول/لتر</span> أو <span class='r'>إذا لوحظت تغيرات في تخطيط القلب.</span> وقد يؤدي ذلك إلى <span class='r'>توقف القلب</span>، وهو يحتاج إلى علاج فوري.","❑ treatment options include the use of calcium gluconate intravenous injections, which min":"❑ تشمل خيارات العلاج استخدام حقن <span class='r'>غلوكونات الكالسيوم</span> الوريدية، التي تقلل من تأثيرات فرط بوتاسيوم الدم على القلب.","❑ i.v injection of soluble insulin promotes the shift of potassium ions into the cells.":"❑ يعزز الحقن الوريدي لـ <span class='r'>الإنسولين القابل للذوبان</span> انتقال أيونات البوتاسيوم إلى داخل الخلايا.","❑ diuretics also can be used to increase the secretion of k⁺ in the kidneys, and":"❑ يمكن أيضًا استخدام <span class='r'>مدرّات البول</span> لزيادة إفراز K⁺ في الكلى، و","❑ dialysis can be a good option if urgent treatment is required.":"❑ يمكن أن يكون <span class='r'>الغسيل الكلوي</span> خيارًا جيدًا إذا كان العلاج العاجل مطلوبًا.","❑ ion-exchange resins, such as polystyrene sulfonate resins, may be used in mild to modera":"❑ قد تُستخدم <span class='r'>راتنجات التبادل الأيوني</span> مثل <span class='r'>راتنجات سلفونات البوليسترين</span> في فرط بوتاسيوم الدم الخفيف إلى المتوسط لإزالة البوتاسيوم الزائد إذا لم تكن هناك تغيرات في تخطيط القلب.","* especially in patients suffering from kidney diseases or end-stage renal failure, the po":"* خصوصًا عند المرضى الذين يعانون من أمراض الكلى أو الفشل الكلوي في مرحلته النهائية، يجب مراقبة مستويات البوتاسيوم بعناية شديدة وتصحيحها عند الضرورة. (لأن تراكم البوتاسيوم في بلازما الدم قد يسبب توقف القلب)","the end...":"النهاية..."};
